# ========================================
# DATASOURCE
# ========================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS PICPAY
%test.quarkus.h2-console.enabled=true
%test.quarkus.h2-console.path=/h2-console

# ========================================
# HIBERNATE
# ========================================
quarkus.hibernate-orm.schema-management.strategy=validate

# ========================================
# LIQUIBASE
# ========================================
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.validate-on-migrate=true
quarkus.liquibase.clean-at-start=true
quarkus.liquibase.default-schema-name=public
quarkus.liquibase.liquibase-schema-name=picpay

# ========================================
# LOG
# ========================================
%test.quarkus.log.level=INFO
%test.quarkus.log.category."liquibase".level=INFO
%test.quarkus.log.category."org.hibernate.SQL".level=INFO
quarkus.log.category."org.hibernate.type.descriptor.sql".level=WARN

# Configurações do Quarkus Test
quarkus.test.native-image-profile=test
quarkus.test.disable-ansi=true

# Configuração de transação para testes
quarkus.transaction-manager-activate=false