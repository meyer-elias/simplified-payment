quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL

# Configuração do H2 para compatibilidade com PostgreSQL
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.database.generation=validate

# Configuração do Liquibase para testes
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/master.yaml
%test.quarkus.liquibase.clean-at-start=true

# Configurações específicas para testes
quarkus.liquibase.validate-on-migrate=true
quarkus.liquibase.clean-at-start=true

# Logging para debug durante testes
%test.quarkus.log.level=INFO
%test.quarkus.log.category."liquibase".level=DEBUG
%test.quarkus.log.category."org.hibernate.SQL".level=DEBUG
%test.quarkus.log.category."org.hibernate.type.descriptor.sql".level=TRACE

# Configurações do Quarkus Test
quarkus.test.native-image-profile=test
quarkus.test.disable-ansi=true

# Configuração de transação para testes
quarkus.transaction-manager-activate=false

# Configuração do H2 Console (útil para debug)
%dev.quarkus.h2-console.enabled=true
%dev.quarkus.h2-console.path=/h2-console