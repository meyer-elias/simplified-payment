# Log level configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Category-specific logging
quarkus.log.category."com.eliasmeyer.sp".level=DEBUG
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=INFO

# Async logging for better performance
quarkus.log.console.async=true
quarkus.log.file.async=true

# Configuração do REST Client
autorizador-api/mp-rest/url=https://em-payment-simplified.free.beeceptor.com
autorizador-api/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
autorizador-api/mp-rest/connectTimeout=5000
autorizador-api/mp-rest/readTimeout=10000

# Config database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Profile de dev com defaults
%dev.quarkus.datasource.username=${DB_USERNAME:eliasmeyer}
%dev.quarkus.datasource.password=${DB_PASSWORD:em}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}

# Liquibase minimal config properties
quarkus.liquibase.migrate-at-start=true

# Liquibase optional config properties
quarkus.liquibase.change-log=db/master.yaml
